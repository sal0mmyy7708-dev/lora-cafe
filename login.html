
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | LORA Café</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 30px 15px;
      background: var(--cream);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      padding: 45px;
      background: var(--white);
      border: 1px solid var(--beige);
    }
    .auth-card h1 {
      font-size: 38px;
      margin-bottom: 10px;
    }
    .auth-card > p {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 25px;
    }
    .auth-card label {
      display: block;
      font-size: 12px;
      margin: 16px 0 7px;
    }
    .auth-card input {
      width: 100%;
      padding: 13px;
      border: 1px solid var(--beige);
      background: var(--cream);
      outline: none;
    }
    .auth-card input:focus {
      border-color: var(--gold);
    }
    .auth-card button {
      width: 100%;
      margin-top: 25px;
    }
    .auth-message {
      font-size: 12px;
      margin-top: 15px;
    }
    .auth-back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: var(--brown);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <a href="/" class="logo">LORA<span>.</span></a>
      <p class="eyebrow" style="margin-top:30px">WELCOME BACK</p>
      <h1>Sign <em>In.</em></h1>
      <p>Enter your details to access your account.</p>

      <form id="loginForm">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Your password" required>

        <button type="submit" class="btn">Login to Your Account</button>
        <p id="loginMessage" class="auth-message"></p>
      </form>

      <a href="/register.html" class="auth-back">Don't have an account? Create one</a>
      <a href="/" class="auth-back">← Back to Home</a>
    </section>
  </main>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      const message = document.getElementById("loginMessage");
      message.textContent = "Connecting login service...";

      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
          })
        });

        const data = await response.json();

        if (!response.ok) throw new Error(data.message || "Login failed.");

        message.textContent = "Login successful!";
        window.location.href = data.user?.role === "admin" ? "/admin.html" : "/";
      } catch (error) {
        message.textContent = error.message;
      }
    });
  </script>
</body>
</html>

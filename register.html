
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | LORA Café</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 30px 15px;
      background: var(--cream);
    }
    .auth-card {
      width: 100%;
      max-width: 460px;
      padding: 42px;
      background: var(--white);
      border: 1px solid var(--beige);
    }
    .auth-card h1 {
      font-size: 38px;
      margin-bottom: 10px;
    }
    .auth-card > p {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 22px;
    }
    .auth-card label {
      display: block;
      font-size: 12px;
      margin: 14px 0 7px;
    }
    .auth-card input {
      width: 100%;
      padding: 13px;
      border: 1px solid var(--beige);
      background: var(--cream);
      outline: none;
    }
    .auth-card input:focus {
      border-color: var(--gold);
    }
    .auth-card button {
      width: 100%;
      margin-top: 24px;
    }
    .auth-message {
      font-size: 12px;
      margin-top: 15px;
    }
    .auth-back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: var(--brown);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <a href="/" class="logo">LORA<span>.</span></a>

      <p class="eyebrow" style="margin-top:28px">JOIN THE LORA EXPERIENCE</p>
      <h1>Create <em>Account.</em></h1>
      <p>Create your account and enjoy every moment with us.</p>

      <form id="registerForm">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Your full name" required minlength="2">

        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 8 characters" required minlength="8">

        <button type="submit" class="btn">Create My Account</button>
        <p id="registerMessage" class="auth-message"></p>
      </form>

      <a href="/login.html" class="auth-back">Already have an account? Login</a>
      <a href="/" class="auth-back">← Back to Home</a>
    </section>
  </main>

  <script>
    document.getElementById("registerForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      const message = document.getElementById("registerMessage");
      message.textContent = "Creating your account...";

      try {
        const response = await fetch("/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: document.getElementById("name").value.trim(),
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value
          })
        });

        const data = await response.json();

        if (!response.ok) throw new Error(data.message || "Registration failed.");

        message.textContent = "Account created successfully!";
        window.location.href = "/login.html";
      } catch (error) {
        message.textContent = error.message;
      }
    });
  </script>
</body>
</html>
